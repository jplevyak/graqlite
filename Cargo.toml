[package]
name = "graqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight graph database built on an append-only record log"
license = "MIT"
repository = "https://github.com/jplevyak/graqlite"
readme = "README.md"
keywords = ["graph", "database", "query-language", "embedded", "datalog"]
categories = ["database-implementations", "data-structures", "command-line-utilities"]
exclude = ["/target", "/issues"]

[dependencies]
arc-swap = "1.9.4"
libc = "0.2.191"
regex-lite = "0.1.9"
rustyline = { version = "19.0.0", optional = true }
sha2 = "0.10.9"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "record_log"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "lookups"
harness = false

[[bench]]
name = "graql"
harness = false

[features]
default = ["cli"]
# The `graqlite` command line shell.
cli = ["dep:rustyline"]

[[bin]]
name = "graqlite"
path = "src/bin/graqlite/main.rs"
required-features = ["cli"]
